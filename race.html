<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会詳細 | 青山学院大学 陸上競技部 データベース</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header data-site-header></header>

<main id="main">
  <div class="loading" data-i18n="common.loading">読み込み中…</div>
</main>

<footer data-site-footer></footer>

<script src="assets/i18n.js"></script>
<script src="data/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
const { loadStore, scoreText } = window.AGUStore;
const { mountLayout, renderTable, fmtDateFull, remarkBadge, medalClass, qs, esc, el } = window.AGUUI;
const { t, onLang } = window.AGUi18n;

(async () => {

mountLayout("races.html");
const store = await loadStore();

const type = qs("type");
const id = qs("id");

const main = document.querySelector("#main");
main.textContent = "";

function breadcrumb(last) {
  return `<div class="breadcrumb"><a href="index.html">${t("nav.overview")}</a> / <a href="races.html">${t("rc.title")}</a> / ${esc(last)}</div>`;
}

/* ---------------- 一般の大会 ---------------- */
if (type === "competition") {
  const comp = store.competitionById.get(id);
  if (!comp) {
    main.innerHTML = `<section class="page-head"><h1>404</h1><p>${t("common.empty")}</p></section>`;
  } else {
    const render = () => {
      document.title = comp.name + " | " + t("brand.title");
      main.textContent = "";
      main.innerHTML = `<section class="page-head">
        ${breadcrumb(comp.name)}
        <h1>${esc(comp.name)}</h1>
        <p>${fmtDateFull(comp.date)}${comp.location ? " · " + esc(comp.location) : ""}</p>
      </section>`;

      const card = el("section", { class: "card pad-0" });
      card.append(el("div", { class: "card-title", style: "padding:16px 16px 0", html: `<h3>${t("rc.itemTable")}</h3>
        <span class="hint">${t("rc.results")}</span>` }));
      const wrap = el("div", { style: "padding:0 4px 8px" });
      card.append(wrap);

      const recs = (store.recordsByCompetition.get(comp.id) || [])
        .slice()
        .sort((a, b) => (a.item || "").localeCompare(b.item || "") || (a.rank ?? 999) - (b.rank ?? 999));
      const rows = [];
      let lastItem = null;
      for (const r of recs) {
        if (r.item !== lastItem) {
          rows.push({ __band: store.itemLabel(r.item) });
          lastItem = r.item;
        }
        rows.push({ r });
      }
      renderTable(wrap, [
        { label: t("col.rank"), cls: "mid", render: (x) => x.r.rank != null ? `<span class="rank">${x.r.rank}</span>` : "—" },
        { label: t("col.name"), cls: "name", render: (x) => {
            const s = store.student(x.r.studentId);
            return s ? `<a href="player.html?id=${s.id}">${esc(s.name)}</a>` : "—";
          } },
        { label: t("col.grade"), cls: "mid", render: (x) => {
            const s = store.student(x.r.studentId);
            const g = s ? store.gradeOfRecord(x.r, s) : null;
            return g === 0 ? t("g.hs") : (g ? g + t("common.year") : "—");
          } },
        { label: t("col.record"), cls: "num", render: (x) => x.r.seconds != null ? `<span class="time">${scoreText(x.r)}</span>` : "—" },
        { label: t("col.remark"), render: (x) => remarkBadge(x.r.remark) },
      ], rows, { empty: t("rc.noResults") });
      main.append(card);
    };
    render();
    onLang(render);
  }

/* ---------------- 駅伝 ---------------- */
} else if (type === "ekiden") {
  const round = store.ekidenRoundById.get(id);
  if (!round) {
    main.innerHTML = `<section class="page-head"><h1>404</h1><p>${t("common.empty")}</p></section>`;
  } else {
    const item = store.ekidenItemById.get(round.ekidenItemId);
    const render = () => {
      document.title = (item?.name || "") + " " + round.round + " | " + t("brand.title");
      main.textContent = "";
      const name = (item?.name || "") + " " + round.round;
      main.innerHTML = `<section class="page-head">
        ${breadcrumb(name)}
        <h1>${esc(name)}</h1>
        <p>${fmtDateFull(round.date)}</p>
      </section>
      <section class="grid cols-2" style="margin-bottom:18px">
        <div class="card stat"><span class="label">${t("rc.teamRank")}</span><span class="value">${round.teamRank}<small>${t("common.place")}</small></span></div>
        <div class="card stat"><span class="label">${t("rc.teamTime")}</span><span class="value" style="font-family:var(--mono)">${esc(round.time)}<small></small></span></div>
      </section>`;

      const card = el("section", { class: "card pad-0" });
      card.append(el("div", { class: "card-title", style: "padding:16px 16px 0", html: `<h3>${t("rc.legTable")}</h3>
        <span class="hint">${t("rc.results")}</span>` }));
      const wrap = el("div", { style: "padding:0 4px 8px" });
      card.append(wrap);

      const recs = (store.ekidenRecordsByRound.get(round.id) || []).slice()
        .sort((a, b) => a.interval - b.interval);
      renderTable(wrap, [
        { label: t("col.interval"), cls: "mid", render: (r) => `${r.interval}${t("common.intervalUnit")}` },
        { label: t("col.distance"), cls: "num", render: (r) => r.distance != null ? r.distance + "km" : "—" },
        { label: t("col.name"), cls: "name", render: (r) => {
            const s = store.student(r.studentId);
            return s ? `<a href="player.html?id=${s.id}">${esc(s.name)}</a>` : "—";
          } },
        { label: t("col.grade"), cls: "mid", render: (r) => {
            const s = store.student(r.studentId);
            const g = s ? store.gradeAt(s, round.date) : null;
            return g ? g + t("common.year") : "—";
          } },
        { label: t("col.record"), cls: "num", render: (r) => `<span class="time">${scoreText(r)}</span>` },
        { label: t("col.legRank"), cls: "mid", render: (r) => r.intervalRank != null ? `<span class="${medalClass(r.intervalRank)}">${r.intervalRank}</span>` : "—" },
        { label: t("col.remark"), render: (r) => remarkBadge(r.remark) },
      ], recs, { empty: t("rc.noResults") });
      main.append(card);
    };
    render();
    onLang(render);
  }
} else {
  main.innerHTML = `<section class="page-head"><h1>404</h1><p>${t("common.empty")}</p></section>`;
}
})();
</script>
</body>
</html>
