<header data-site-header></header>

<main>
  <section class="page-head">
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.overview">概況</a> / <span data-i18n="ab.title">このサイトについて</span></div>
    <h1 data-i18n="ab.title">このサイトについて</h1>
    <p data-i18n="ab.desc">選手成績・大会記録・時点別ランキングを閲覧できる個人ファンサイトです。</p>
  </section>

  <section class="card" style="margin-bottom:18px">

    <div class="card-title"><h3 data-i18n="ab.h2">データについて</h3></div>

const { loadStore } = window.AGUStore;
const { mountLayout, setGeneratedAt } = window.AGUUI;
const { t, onLang } = window.AGUi18n;

(async () => {

mountLayout("about.html");
const store = await loadStore();
setGeneratedAt(store.generatedAt);

onLang(() => { document.title = t("ab.title") + " | " + t("brand.title"); });
document.title = t("ab.title") + " | " + t("brand.title");
})();
