<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時点ランキング | 青山学院大学 陸上競技部 データベース</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header data-site-header></header>

<main>
  <section class="page-head">
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.overview">概況</a> / <span data-i18n="rk.title">時点ランキング</span></div>
    <h1 data-i18n="rk.title">時点ランキング</h1>
    <p data-i18n="rk.desc">指定した日付「その時点」での部内記録ランキング。</p>
  </section>

  <section class="controls">
    <div class="field">
      <label data-i18n="rk.date">基準日</label>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="btn ghost" id="prevYear" data-i18n="rk.prevYear">« 1年</button>
        <button class="btn ghost" id="prevDay" data-i18n="rk.prevDay">前日</button>
        <input type="date" id="dateInput">
        <button class="btn ghost" id="nextDay" data-i18n="rk.nextDay">翌日</button>
        <button class="btn ghost" id="nextYear" data-i18n="rk.nextYear">1年 »</button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="common.item">種目</label>
      <select id="itemSel"></select>
    </div>
    <div class="field">
      <label data-i18n="rk.sex">性別</label>
      <select id="sexSel">
        <option value="男" data-i18n="common.men">男子</option>
        <option value="女" data-i18n="common.women">女子</option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="rk.scope">対象</label>
      <select id="scopeSel">
        <option value="active" data-i18n="rk.scopeActive">その時点の在籍選手（退部・転向を除く）</option>
        <option value="member" data-i18n="rk.scopeMember">その時点の在籍部員（退部・転向も含む）</option>
        <option value="all" data-i18n="rk.scopeAll">歴代全員（OB・OG含む）</option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="rk.include">成績包含</label>
      <select id="includeSel">
        <option value="all" data-i18n="rk.includeAll">全部成績（高校時代を含む）</option>
        <option value="enrolled" data-i18n="rk.includeEnrolled">在学中のみ</option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="rk.mode">表示</label>
      <select id="modeSel">
        <option value="best" data-i18n="rk.modeBest">各人のベスト（1人1行）</option>
        <option value="top" data-i18n="rk.modeTop">上位成績（1人複数行）</option>
        <option value="all" data-i18n="rk.modeAll">全成績（1人複数行）</option>
      </select>
    </div>
    <div class="field" id="perField">
      <label data-i18n="rk.per">1人あたり</label>
      <select id="perSel">
        <option value="1" data-i18n="rk.per1">上位1本</option>
        <option value="2" data-i18n="rk.per2">上位2本</option>
        <option value="3" data-i18n="rk.per3">上位3本</option>
        <option value="5" data-i18n="rk.per5">上位5本</option>
        <option value="10" data-i18n="rk.per10">上位10本</option>
        <option value="999" data-i18n="rk.perAll">全部</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn ghost" id="csvBtn" data-i18n="rk.csv">CSVダウンロード</button>
    </div>
  </section>

  <section class="card pad-0" style="margin-bottom:18px">
    <div class="card-title" style="padding:16px 16px 0">
      <h3><span data-i18n="rk.resultCount">表示件数</span>：<span id="rowCount">0</span> <span class="hint" data-i18n="rk.rows">件</span></h3>
    </div>
    <div style="padding:4px" id="rankTable"></div>
  </section>

  <section class="card" style="margin-bottom:18px">
    <div class="card-title">
      <h3 data-i18n="rk.chart">記録の推移</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="hint" data-i18n="rk.chartNote">表の「＋」で最大6人まで下のグラフに追加できます。</span>
        <button class="btn ghost mini" id="chartClear" data-i18n="rk.clear">選択解除</button>
      </div>
    </div>
    <div id="chartBox"></div>
  </section>

  <p class="footnote" data-i18n="rk.footnote">
    ※ 順位は「その日時点で判明している記録」での部内順位です。
  </p>
</main>

<footer data-site-footer></footer>

<script src="assets/i18n.js"></script>
<script src="data/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
const { loadStore, ITEM_ORDER, scoreText, formatScore, parseScore } = window.AGUStore;
const { mountLayout, renderTable, fmtDateCell, qs, lineChart, esc } = window.AGUUI;
const { t, onLang } = window.AGUi18n;

(async () => {

mountLayout("rankings.html");
const store = await loadStore();

const today = new Date();
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = iso(today);

const state = {
  date: qs("date") || todayISO,
  item: qs("item") || "five_5000m",
  sex: qs("sex") || "男",
  scope: qs("scope") || "active",
  include: qs("include") || "all",
  mode: qs("mode") || "best",
  per: Math.min(999, Math.max(1, +qs("per") || 1)),
  chartIds: [],
};

const $ = (id) => document.getElementById(id);

const itemsForSex = () => ITEM_ORDER.filter((k) =>
  store.records.some((r) => r.item === k && (store.student(r.studentId)?.sex || "男") === state.sex));

function syncUrl() {
  const p = new URLSearchParams();
  p.set("date", state.date); p.set("item", state.item); p.set("sex", state.sex);
  p.set("scope", state.scope); p.set("include", state.include); p.set("mode", state.mode);
  if (state.mode !== "best") p.set("per", state.per);
  history.replaceState(null, "", "?" + p.toString());
}

function shiftDate(days, years = 0) {
  const d = new Date(state.date + "T00:00:00");
  d.setDate(d.getDate() + days);
  if (years) d.setFullYear(d.getFullYear() + years);
  state.date = iso(d);
}

function computeRows() {
  if (state.mode === "best") {
    return store.rankingAsOf(state.date, state.item, { scope: state.scope, include: state.include, sex: state.sex })
      .map((r) => ({ ...r, grade: r.grade, delta: r.rankAtPb, isPB: true }));
  }
  const pool = state.scope === "all"
    ? (state.sex ? store.studentsBySex(state.sex) : store.students)
    : store.rosterAsOf(state.date, { sex: state.sex, includeWithdraw: state.scope === "member" });
  const rows = [];
  for (const s of pool) {
    let list = store.recordsOf(s.id, { include: state.include })
      .filter((r) => r.item === state.item && r.isFinished !== false && r.seconds != null
        && r.date && r.date <= state.date)
      .sort((a, b) => a.seconds - b.seconds);
    if (state.mode === "top") list = list.slice(0, state.per);
    const pb = state.include === "all" ? store.pbAsOf(s.id, state.item, state.date) : null;
    for (const r of list) {
      rows.push({
        student: s, record: r, seconds: r.seconds,
        grade: store.gradeOfRecord(r, s),
        isPB: !!(pb && r.seconds === pb.seconds && r.date === pb.date),
      });
    }
  }
  rows.sort((a, b) => a.seconds - b.seconds || (a.record.date || "").localeCompare(b.record.date || ""));
  rows.forEach((r, i) => {
    r.rank = i + 1;
    r.delta = store.rankOf(r.student.id, state.item, r.record.date, state.scope, state.include, state.sex);
  });
  return rows;
}

let lastRows = [];

function render() {
  document.title = t("rk.title") + " | " + t("brand.title");

  const itemSel = $("itemSel");
  itemSel.innerHTML = itemsForSex().map((k) => `<option value="${k}">${store.itemLabel(k)}</option>`).join("");
  if (!itemsForSex().includes(state.item)) state.item = itemsForSex()[0];
  itemSel.value = state.item;

  $("dateInput").value = state.date;
  $("dateInput").max = todayISO;
  $("sexSel").value = state.sex;
  $("scopeSel").value = state.scope;
  $("includeSel").value = state.include;
  $("modeSel").value = state.mode;
  $("perSel").value = String(state.per);
  $("perField").style.display = state.mode === "best" ? "none" : "";

  const rows = computeRows();
  lastRows = rows;
  $("rowCount").textContent = rows.length;

  const isBest = state.mode === "best";
  const columns = [
    { label: t("col.rank"), cls: "mid", render: (r) => `<span class="rank">${r.rank}</span>` },
    { label: t("col.name"), cls: "name", render: (r) => `<a href="player.html?id=${r.student.id}">${r.student.name}</a>` },
    { label: t("col.grade"), cls: "mid", render: (r) => r.grade ? r.grade + t("common.year") : "—" },
    { label: t("col.record"), cls: "num", render: (r) => `<span class="time${r.isPB ? " pb-cell" : ""}">${scoreText(r.record)}</span>` },
    { label: t("col.date"), cls: "num", render: (r) => fmtDateCell(r.record, r.student) },
    { label: t("col.delta"), cls: "num", render: (r) => {
        if (r.delta == null) return "—";
        const arrow = r.delta > r.rank ? ' <span class="delta-down">▼</span>' : r.delta < r.rank ? ' <span class="delta-up">▲</span>' : "";
        return `${r.delta}${arrow}`;
      } },
  ];
  if (!isBest) {
    columns.push({
      label: t("col.comp"), render: (r) => r.record.competitionId
        ? esc(store.competitionById.get(r.record.competitionId)?.name || "—")
        : esc(r.record.competitionName || "—"),
    });
  }
  columns.push({
    label: "＋", cls: "mid", render: (r) => {
      const on = state.chartIds.includes(r.student.id);
      return `<button class="btn ghost mini ${on ? "active" : ""}" data-add="${r.student.id}">${on ? "✓" : t("rk.chartAdd")}</button>`;
    },
  });

  renderTable($("rankTable"), columns, rows, { empty: t("common.empty") });

  $("rankTable").querySelectorAll("[data-add]").forEach((b) => {
    b.addEventListener("click", () => {
      const id = +b.dataset.add;
      const i = state.chartIds.indexOf(id);
      if (i >= 0) state.chartIds.splice(i, 1);
      else if (state.chartIds.length < 6) state.chartIds.push(id);
      render();
    });
  });

  renderChart();
  syncUrl();
}

function renderChart() {
  const box = $("chartBox");
  const series = state.chartIds
    .map((id) => {
      const s = store.student(id);
      if (!s) return null;
      const hist = store.pbHistory(id, state.item, state.date, { include: state.include });
      return { name: s.name, points: hist.map((r) => ({ x: r.date, y: r.seconds, label: scoreText(r) })) };
    })
    .filter((s) => s && s.points.length);
  box.textContent = "";
  box.append(lineChart(series, { height: 300, valueFmt: (v) => formatScore(v, false) }));
}

// --- CSV ---
function csv() {
  const head = [t("col.rank"), t("col.name"), t("col.grade"), t("col.record"), t("col.date"), t("col.delta")];
  const lines = [head.join(",")];
  for (const r of lastRows) {
    const g = r.grade ? r.grade : "";
    lines.push([r.rank, r.student.name, g, scoreText(r.record).replace(/\.00$/, ""), r.record.date || "", r.delta ?? ""].join(","));
  }
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ranking_${state.item}_${state.date}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- 事件绑定 ---
$("itemSel").addEventListener("change", (e) => { state.item = e.target.value; render(); });
$("sexSel").addEventListener("change", (e) => { state.sex = e.target.value; render(); });
$("scopeSel").addEventListener("change", (e) => { state.scope = e.target.value; render(); });
$("includeSel").addEventListener("change", (e) => { state.include = e.target.value; render(); });
$("modeSel").addEventListener("change", (e) => { state.mode = e.target.value; render(); });
$("perSel").addEventListener("change", (e) => { state.per = +e.target.value; render(); });
$("dateInput").addEventListener("change", (e) => { if (e.target.value) { state.date = e.target.value; render(); } });
$("prevYear").addEventListener("click", () => { shiftDate(0, -1); render(); });
$("nextYear").addEventListener("click", () => { shiftDate(0, 1); render(); });
$("prevDay").addEventListener("click", () => { shiftDate(-1); render(); });
$("nextDay").addEventListener("click", () => { shiftDate(1); render(); });
$("csvBtn").addEventListener("click", csv);
$("chartClear").addEventListener("click", () => { state.chartIds = []; render(); });

render();
onLang(render);
})();
</script>
</body>
</html>
