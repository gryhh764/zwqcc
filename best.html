<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自己ベスト | 青山学院大学 陸上競技部 データベース</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header data-site-header></header>

<main>
  <section class="page-head">
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.overview">概況</a> / <span data-i18n="best.title">自己ベスト</span></div>
    <h1 data-i18n="best.title">自己ベスト</h1>
    <p data-i18n="best.desc">種目ごとの部内自己ベストランキング。</p>
  </section>

  <section class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="pill-row" id="sexPills">
      <button class="btn ghost active" data-sex="男" data-i18n="common.men">男子</button>
      <button class="btn ghost" data-sex="女" data-i18n="common.women">女子</button>
    </div>
    <div class="field">
      <label data-i18n="common.item">種目</label>
      <select id="itemSel"></select>
    </div>
    <div class="pill-row" id="scopePills">
      <button class="btn ghost active" data-scope="active" data-i18n="best.scopeCurrent">現役のみ</button>
      <button class="btn ghost" data-scope="all" data-i18n="best.scopeAll">歴代全員（OB・OG含む）</button>
    </div>
    <span class="hint" style="color:var(--muted);font-size:12px" data-i18n="best.pbNote">自己ベストは赤枠で表示しています。</span>
  </section>

  <section class="card pad-0">
    <div class="card-title" style="padding:16px 16px 0">
      <h3><span id="listTitle"></span></h3>
      <span class="hint" id="listCount"></span>
    </div>
    <div style="padding:4px" id="bestTable"></div>
  </section>
</main>

<footer data-site-footer></footer>

<script src="assets/i18n.js"></script>
<script src="data/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
const { loadStore, ITEM_ORDER, scoreText } = window.AGUStore;
const { mountLayout, renderTable, fmtDateCell, qs, esc } = window.AGUUI;
const { t, onLang } = window.AGUi18n;

(async () => {

mountLayout("best.html");
const store = await loadStore();

const state = {
  sex: qs("sex") || "男",
  item: qs("item") || null,
  scope: qs("scope") || "active",
};

const $ = (id) => document.getElementById(id);

const itemsForSex = () => ITEM_ORDER.filter((k) =>
  store.records.some((r) => r.item === k && (store.student(r.studentId)?.sex || "男") === state.sex));

const today = new Date();
const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

function render() {
  document.title = t("best.title") + " | " + t("brand.title");

  const keys = itemsForSex();
  const itemSel = $("itemSel");
  itemSel.innerHTML = keys.map((k) => `<option value="${k}">${store.itemLabel(k)}</option>`).join("");
  if (!keys.includes(state.item)) state.item = keys.includes("five_5000m") ? "five_5000m" : keys[0];
  itemSel.value = state.item;

  document.querySelectorAll("#sexPills [data-sex]").forEach((b) =>
    b.classList.toggle("active", b.dataset.sex === state.sex));
  document.querySelectorAll("#scopePills [data-scope]").forEach((b) =>
    b.classList.toggle("active", b.dataset.scope === state.scope));

  const rows = store.allTimeRanking(state.item, { scope: state.scope, sex: state.sex });
  rows.forEach((r) => {
    r.__cls = store.isPlayerAt(r.student, todayISO) ? "row-current" : "";
  });

  $("listTitle").textContent =
    `${state.sex === "女" ? t("common.women") : t("common.men")} ${store.itemLabel(state.item)} · ` +
    (state.scope === "active" ? t("best.scopeCurrent") : t("best.scopeAll"));
  $("listCount").textContent = `${rows.length} ${t("common.person")}`;

  renderTable($("bestTable"), [
    { label: t("col.rank"), cls: "mid", render: (r) => `<span class="rank">${r.rank}</span>` },
    { label: t("col.name"), cls: "name", render: (r) => `<a href="player.html?id=${r.student.id}">${r.student.name}</a>` },
    { label: t("col.enrollment"), cls: "mid", render: (r) => r.student.enrollmentYear },
    { label: t("col.record"), cls: "num", render: (r) => `<span class="time pb-cell">${scoreText(r.record)}</span>` },
    { label: t("col.date"), cls: "num", render: (r) => fmtDateCell(r.record, r.student) },
    { label: t("col.comp"), render: (r) => r.record.competitionId
        ? esc(store.competitionById.get(r.record.competitionId)?.name || "—")
        : esc(r.record.competitionName || "—") },
  ], rows, { empty: t("common.empty") });

  const p = new URLSearchParams();
  p.set("sex", state.sex); p.set("item", state.item); p.set("scope", state.scope);
  history.replaceState(null, "", "?" + p.toString());
}

$("itemSel").addEventListener("change", (e) => { state.item = e.target.value; render(); });
document.querySelectorAll("#sexPills [data-sex]").forEach((b) => {
  b.addEventListener("click", () => { state.sex = b.dataset.sex; render(); });
});
document.querySelectorAll("#scopePills [data-scope]").forEach((b) => {
  b.addEventListener("click", () => { state.scope = b.dataset.scope; render(); });
});

render();
onLang(render);
})();
</script>
</body>
</html>
